name: Deploy

# Every push to main uploads the site to the server via rsync.
# Setup (key, environment, secrets): Documentation/deployment-setup.md
#
# Security rules for this file (the repo is public):
#  - No pull_request / pull_request_target trigger, otherwise forks could run code with access
#    to the secrets.
#  - No credentials or server details in plain text; everything comes from the "production" environment.
#  - Pin actions only to a full commit SHA (Dependabot keeps them up to date).
#  - Never insert ${{ github.event.* }} or other foreign input directly into "run:".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two deployments at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

# Default: no permissions. The job below only requests what is strictly necessary.
permissions: {}

env:
  SITE_URL: https://pokemon.hamidoudiallo.de/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the "production" environment, which is only released for the main branch.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Protection against an empty checkout: --delete would otherwise empty the live site.
      - name: Check completeness
        run: test -f index.html && test -d css && test -d js

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The target is "/" because the key is restricted server-side to the web directory
      # via rrsync (see docs). The path is deliberately not stored in this repo.
      # --delete removes files that no longer exist in the repo. Excluded paths are left
      # untouched: .well-known/ (Let's Encrypt) is not deleted.
      - name: Upload files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -rltzv --delete \
            --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='.well-known/' \
            --exclude='.DS_Store' \
            --exclude='.gitignore' \
            --exclude='Documentation/' \
            --exclude='plan.drawio' \
            --exclude='up.sh' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Check site
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --output /dev/null "$SITE_URL"
