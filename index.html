<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon</title>

    <link rel="icon" type="image/x-icon" href="images/pokemon.webp" />

    <!-- Reihenfolge wichtig: spätere Regeln überschreiben frühere (utilities zuletzt) -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/pokemon-cards.css" />
    <link rel="stylesheet" href="css/pokemon-detail.css" />
    <link rel="stylesheet" href="css/bars.css" />
    <link rel="stylesheet" href="css/about.css" />
    <link rel="stylesheet" href="css/evolution.css" />
    <link rel="stylesheet" href="css/matchups.css" />
    <link rel="stylesheet" href="css/moves.css" />
    <link rel="stylesheet" href="css/utilities.css" />

    <!-- Reihenfolge wichtig: alles baut auf den Dateien darüber auf.
         Die Tabs erscheinen im Popup in der Reihenfolge, in der sie hier stehen. -->
    <script defer src="js/configuration.js"></script>
    <script defer src="js/state.js"></script>
    <script defer src="js/text-and-image-helpers.js"></script>
    <script defer src="js/data-loading.js"></script>
    <script defer src="js/components.js"></script>
    <script defer src="js/pokemon-list.js"></script>
    <script defer src="js/pokemon-detail.js"></script>
    <script defer src="js/tabs/about.js"></script>
    <script defer src="js/tabs/stats.js"></script>
    <script defer src="js/tabs/evolution.js"></script>
    <script defer src="js/tabs/matchups.js"></script>
    <script defer src="js/tabs/moves.js"></script>
  </head>

  <body onload="initializePokedex()">
    <header>
      <div class="header-content">
        <a class="header-brand" href="./" aria-label="Pokédex – Startseite">
          <img class="pokedex-logo" src="images/pokemon.webp" alt="" />
          <span class="header-title">Pokédex</span>
        </a>
        <input
          class="search-input"
          type="search"
          placeholder="Search"
          aria-label="Search Pokémon"
          id="search-input"
          oninput="scheduleSearch()"
        />
      </div>
    </header>

    <div class="pokedex" id="pokedex">
      <p class="pokedex-message hidden" id="pokedex-message" role="status"></p>
    </div>

    <div class="load-buttons hidden" id="load-buttons">
      <button type="button" class="load-more" onclick="loadNextPokemonPage()">
        <img class="load-more-icon" src="images/pokemon.webp" alt="" />
        <span>Mehr fangen</span>
      </button>
      <button
        type="button"
        class="load-more load-all"
        onclick="loadAllRemainingPokemon()"
      >
        <svg
          class="load-more-icon"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="7.5" height="7.5" rx="2"></rect>
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="2"></rect>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"></rect>
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"></rect>
        </svg>
        <span id="load-all-label">Alle anzeigen</span>
      </button>
    </div>

    <div
      class="detail-overlay hidden"
      id="detail-overlay"
      onclick="closeDetailIfOverlayClicked(event)"
    ></div>

    <footer>
      <a
        target="_blank"
        rel="noopener"
        class="footer-link"
        href="datenschutzt.html"
        >Datenschutz</a
      >
      &vert;
      <a
        target="_blank"
        rel="noopener"
        class="footer-link"
        href="Impressum.html"
        >Impressum</a
      >
    </footer>
  </body>
</html>
